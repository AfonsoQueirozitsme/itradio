<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ec5a57" />
    <title>Sem ligação · Radio IT</title>
    <!-- Página 100% autónoma: sem pedidos externos, funciona offline. -->
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family:
          system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial,
          sans-serif;
        color: #fff;
        text-align: center;
        background: linear-gradient(
          135deg,
          #ff5c8a 0%,
          #ec5a57 30%,
          #ff8a3d 70%,
          #cfe0f3 100%
        );
      }
      .card {
        max-width: 420px;
      }
      .wordmark {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 40px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 58px;
        padding: 2px 14px;
        border-radius: 999px;
        background: #fff;
        color: #ec5a57;
      }
      h1 {
        margin: 28px 0 10px;
        font-size: 22px;
        font-weight: 700;
      }
      p {
        margin: 0 auto;
        max-width: 34ch;
        font-size: 16px;
        line-height: 1.5;
        color: rgba(255, 255, 255, 0.92);
      }
      button {
        margin-top: 28px;
        padding: 12px 26px;
        font-size: 16px;
        font-weight: 600;
        color: #ec5a57;
        background: #fff;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
      }
      button:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="wordmark">Radio<span class="pill">IT</span></div>
      <h1>Estás sem ligação</h1>
      <p>
        Não conseguimos chegar à rádio. Volta a ligar-te à internet para ouvir
        em direto.
      </p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
